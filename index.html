<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peserta Wawancara Magang Kantah Bintan</title>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS untuk Ekspor Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #fff; }
    
    .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #1e293b; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
    .stat-card span { font-size: 24px; font-weight: bold; color: #38bdf8; display: block; }

    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #2563eb; color: #fff; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; }
    
    .badge { background: #10b981; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .btn-action { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .status-text { margin-bottom: 10px; font-size: 14px; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Peserta Wawancara Magang Kantah Bintan</h1>
    </header>

    <div class="stats-bar">
      <div class="stat-card">Total Pelamar<span id="count-total">0</span></div>
      <div class="stat-card">Kategori Survei<span id="count-survei">0</span></div>
      <div class="stat-card">Kategori Yuridis<span id="count-yuridis">0</span></div>
    </div>

    <div id="status-sync" class="status-text">Memuat data...</div>

    <div class="tabs">
      <button class="tab-btn active" id="btn-survei" onclick="switchTab('survei')">Tenaga Teknis Survei</button>
      <button class="tab-btn" id="btn-yuridis" onclick="switchTab('yuridis')">Tenaga Administrasi & Yuridis</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>NO</th>
          <th>KANDIDAT</th>
          <th>POSISI DILAMAR</th>
          <th>PENDIDIKAN</th>
          <th>STATUS</th>
          <th>AKSI</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6" style="text-align:center;">Sedang mengambil data...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = 'https://klpmlblcmmrnqkhukqzd.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_oWOp8TPwWScDLyTozwjRTg_QsNT-St0';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false,
        detectSessionInUrl: false
      }
    });

    let dataSurvei = [];
    let dataYuridis = [];
    let currentDataSet = 'survei';
    let isLoadingApplicants = false;

    function setSyncStatus(msg) {
      const el = document.getElementById('status-sync');
      if (el) el.innerText = msg;
    }

    async function loadApplicants() {
      if (isLoadingApplicants) return;
      isLoadingApplicants = true;
      setSyncStatus('Memuat data dari Supabase...');

      try {
        const { data, error } = await supabaseClient
          .from('peserta_wawancara')
          .select('*')
          .eq('deleted', false)
          .order('kategori')
          .order('no');

        if (error) throw error;

        // Kosongkan array untuk mencegah duplikasi/membengkak
        dataSurvei.length = 0;
        dataYuridis.length = 0;

        (data || []).forEach(item => {
          // Normalisasi field nama agar tidak muncul "-"
          item.name = item.nama || item.name || '-';

          if (item.kategori === 'survei') {
            dataSurvei.push(item);
          } else if (item.kategori === 'yuridis') {
            dataYuridis.push(item);
          }
        });

        renderTable(currentDataSet);
        updateTabCounts();
        setSyncStatus('Data berhasil diperbarui (Realtime Aktif)');
      } catch (error) {
        console.error('Error Supabase:', error);
        setSyncStatus('Gagal memuat data: ' + error.message);
      } finally {
        isLoadingApplicants = false;
      }
    }

    function renderTable(type) {
      currentDataSet = type;
      const list = type === 'survei' ? dataSurvei : dataYuridis;
      const tbody = document.getElementById('table-body');
      if (!tbody) return;

      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Tidak ada data pelamar.</td></tr>`;
        return;
      }

      list.forEach((item, index) => {
        const displayName = item.nama || item.name || '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>
            <strong>${displayName}</strong><br>
            <small style="color: #94a3b8;">${item.email || '-'}</small>
          </td>
          <td>${item.posisi || '-'}</td>
          <td>${item.pendidikan || '-'}</td>
          <td><span class="badge">${item.status || 'Pelamar'}</span></td>
          <td>
            <button class="btn-action" onclick="deleteApplicant('${item.id}')">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function switchTab(type) {
      document.getElementById('btn-survei').classList.toggle('active', type === 'survei');
      document.getElementById('btn-yuridis').classList.toggle('active', type === 'yuridis');
      renderTable(type);
    }

    function updateTabCounts() {
      document.getElementById('count-survei').innerText = dataSurvei.length;
      document.getElementById('count-yuridis').innerText = dataYuridis.length;
      document.getElementById('count-total').innerText = dataSurvei.length + dataYuridis.length;
    }

    async function deleteApplicant(id) {
      if (!confirm('Yakin ingin menghapus peserta ini?')) return;
      try {
        const { error } = await supabaseClient
          .from('peserta_wawancara')
          .update({ deleted: true })
          .eq('id', id);

        if (error) throw error;
        loadApplicants();
      } catch (err) {
        alert('Gagal menghapus: ' + err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadApplicants();
    });
  </script>
</body>
</html>
