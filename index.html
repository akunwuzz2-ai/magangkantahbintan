<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peserta Wawancara Magang Kantah Bintan</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- SheetJS untuk Ekspor Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <!-- Tambahkan elemen UI pendukung di sini sesuai struktur halaman Anda -->

  <script>
    // 1. Inisialisasi Supabase Client (Ganti dengan URL & Key milik Anda)
    const SUPABASE_URL = 'https://klpmlblcmmrnqkhukqzd.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_oWOp8TPwWScDLyTozwjRTg_QsNT-St0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let dataSurvei = [];
    let dataYuridis = [];
    let currentDataSet = 'survei'; // Default tab
    let isLoadingApplicants = false;

    // Helper untuk menampilkan status sinkronisasi
    function setSyncStatus(msg, isSuccess) {
      console.log(`[Status]: ${msg}`);
    }

    // Helper Kunci Unik Kandidat (Penanganan nama/email)
    function getCandidateKey(item) {
      const candidateName = item.nama || item.name || '';
      return `${String(item.email || candidateName).trim().toLowerCase()}__${String(item.posisi || '').trim().toLowerCase()}`;
    }

    // 2. Fungsi Utama Load Applicants (Mencegah Duplikasi Data & Fix Nama -)
    async function loadApplicants(showStatus = true) {
      if (isLoadingApplicants) return;
      isLoadingApplicants = true;
      try {
        const { data, error } = await supabaseClient
          .from('peserta_wawancara')
          .select('*')
          .eq('deleted', false)
          .order('kategori')
          .order('no');

        if (error) throw error;

        // KOSONGKAN ARRAY TERLEBIH DAHULU UNTUK MENCEGAH DUPLIKASI/MEMBENGKAK
        dataSurvei.length = 0;
        dataYuridis.length = 0;

        (data || []).forEach(item => {
          // Normalisasi properti nama (mendukung 'nama' atau 'name')
          item.name = item.nama || item.name || '-';

          if (item.kategori === 'survei') {
            dataSurvei.push(item);
          } else if (item.kategori === 'yuridis') {
            dataYuridis.push(item);
          }
        });

        renderTable(currentDataSet);
        updateTabCounts();
        if (showStatus) setSyncStatus('Realtime aktif', true);
      } catch (error) {
        console.error(error);
        setSyncStatus('Gagal memuat database', false);
        alert('Gagal mengambil data dari Supabase:\n' + error.message);
      } finally {
        isLoadingApplicants = false;
      }
    }

    // 3. Render Tabel Peserta
    function renderTable(type) {
      currentDataSet = type;
      const list = type === 'survei' ? dataSurvei : dataYuridis;
      const tbody = document.getElementById('table-body');
      if (!tbody) return;

      tbody.innerHTML = '';

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Tidak ada data pelamar.</td></tr>`;
        return;
      }

      list.forEach((item, index) => {
        const displayName = item.nama || item.name || '-';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>
            <strong>${displayName}</strong><br>
            <small>${item.email || '-'}</small>
          </td>
          <td>${item.posisi || '-'}</td>
          <td>${item.pendidikan || '-'}</td>
          <td><span class="badge">${item.status || 'Pelamar'}</span></td>
          <td>
            <button onclick="openModal(${index})">Detail</button>
            <button onclick="deleteApplicant('${item.id}')">Hapus</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 4. Update Angka Tab & Counter
    function updateTabCounts() {
      const elSurvei = document.getElementById('count-survei');
      const elYuridis = document.getElementById('count-yuridis');
      const elTotal = document.getElementById('count-total');

      if (elSurvei) elSurvei.innerText = dataSurvei.length;
      if (elYuridis) elYuridis.innerText = dataYuridis.length;
      if (elTotal) elTotal.innerText = dataSurvei.length + dataYuridis.length;
    }

    // 5. Ekspor Data Ke Excel
    function makeExportRow(item) {
      const json = item.json_data || {};
      const profil = json.profil_pelamar || {};
      const pddikti = json.pddikti || {};

      return {
        'Nama': item.nama || item.name || '-',
        'Email': item.email || '-',
        'Posisi Dilamar': item.posisi || '-',
        'Pendidikan': item.pendidikan || '-',
        'Tanggal Lahir': profil.tanggal_lahir || '-',
        'Usia': profil.usia || '-',
        'Domisili': profil.domisili || '-',
        'Jenis Kelamin': profil.jenis_kelamin || '-',
        'Perguruan Tinggi': pddikti.perguruan_tinggi || '-',
        'Program Studi': pddikti.program_studi || '-'
      };
    }

    // Modal & Preview Foto (Mendukung nama kandidat)
    function openModal(index) {
      const list = currentDataSet === 'survei' ? dataSurvei : dataYuridis;
      const item = list[index];
      if (!item) return;

      const candidateName = item.nama || item.name || '-';
      const nameEl = document.getElementById("modal-name");
      if (nameEl) nameEl.innerText = candidateName;
    }

    // Inisialisasi Pertama
    document.addEventListener('DOMContentLoaded', () => {
      loadApplicants();
    });
  </script>
</body>
</html>
